name: Luminosity
version: '${version}'
main: com.chunx.luminosity.LuminosityPlugin
api-version: '1.21'
author: chunx
description: Light and Void paths driven by a transferable Luminosity score.
folia-supported: false

commands:
  luminosity:
    description: View or adjust Luminosity.
    usage: /luminosity [get|set|add|revive|eclipse|core|sigil]
    aliases: [lum]

permissions:
  luminosity.admin:
    description: Adjust other players' Luminosity, revive them, and spawn plugin items.
    default: op
